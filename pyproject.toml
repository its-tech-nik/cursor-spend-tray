[project]
name = "cursor-spend-tray"
version = "0.1.0"
description = "Linux tray app that tracks Cursor Pro spending via Zen Browser"
readme = "README.md"
authors = [
    { name = "technik", email = "m.nik1997@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
    "websockets>=17.1",
]

[project.scripts]
cursor-spend-tray = "cursor_spend_tray:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
