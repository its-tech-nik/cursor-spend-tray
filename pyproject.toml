[project]
name = "cursor-spend-tray"
version = "0.1.0"
description = "Linux tray app that tracks Cursor Pro spending via Zen Browser"
readme = "README.md"
license = "MIT"
authors = [
    { name = "technik", email = "m.nik1997@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.0",
    "pyqt6>=6.11.0",
    "websockets>=14.0",
]

[project.scripts]
cursor-spend-tray = "cursor_spend_tray:main"

[project.urls]
Homepage = "https://github.com/its-tech-nik/cursor-spend-tray"
Repository = "https://github.com/its-tech-nik/cursor-spend-tray"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
